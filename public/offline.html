<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Écoute hors ligne · Janngude</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#121212" />
    <style>
      :root { --page:#d9f0f5; --paper:#f4f4f4; --surface:#ffffff; --surface-2:#ededed; --ink:#121212; --ink-2:#3a3a3a; --muted:#7c7c7c; --mint:#d8f6dc; --sky:#d6f0f6; --lavender:#e6d4fb; --lemon:#fbf0c4; --pink:#f9d4e6; --shadow:0 2px 12px rgb(18 18 18 / .05); --pop:0 24px 64px -20px rgb(18 18 18 / .35), 0 4px 14px rgb(18 18 18 / .08); }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; font-family: Rubik, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--page); color: var(--ink); }
      .frame { margin: 8px; min-height: calc(100vh - 16px); background: var(--ink); border-radius: 32px; display: flex; flex-direction: column; overflow: hidden; }
      @media (min-width: 640px) { .frame { margin: 16px; min-height: calc(100vh - 32px); border-radius: 40px; } }
      header { color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 68px; padding: 0 16px; }
      @media (min-width: 640px) { header { height: 76px; padding: 0 28px; } }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 600; font-size: 22px; letter-spacing: -0.02em; }
      .brand svg { width: 32px; height: 32px; }
      .back { color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; padding: 9px 14px; border-radius: 999px; background: rgb(255 255 255 / .1); }
      .back:hover { background: rgb(255 255 255 / .2); }
      .panel { position: relative; flex: 1; margin: 0 8px 8px; background: var(--paper); border-radius: 28px; padding: 28px 16px calc(140px + env(safe-area-inset-bottom)); }
      @media (min-width: 640px) { .panel { margin: 0 12px 12px; border-radius: 34px; padding: 40px 32px 160px; } }
      .notch { position: absolute; left: 50%; top: 0; width: 96px; height: 16px; transform: translateX(-50%); background: var(--ink); border-radius: 0 0 16px 16px; }
      .wrap { max-width: 1100px; margin: 0 auto; }
      h1 { font-size: 34px; margin: 0; letter-spacing: -0.02em; line-height: 1.1; }
      @media (min-width: 640px) { h1 { font-size: 42px; } }
      .sub { color: var(--muted); margin: 8px 0 0; font-size: 15px; max-width: 42rem; }
      .status { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 6px 12px; border-radius: 999px; background: var(--lemon); color: #6b4d00; font-size: 13px; font-weight: 500; }
      .status:empty { display: none; }
      .status img { width: 56px; height: 56px; vertical-align: middle; margin-right: 10px; }
      .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 28px 0 16px; }
      .top h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
      .count { font-size: 13px; font-weight: 600; color: var(--ink-2); background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 2px 10px; }
      .count:empty { display: none; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
      @media (min-width: 900px) { ul { grid-template-columns: 1fr 1fr; } }
      li { background: var(--surface); border-radius: 24px; padding: 16px; box-shadow: var(--shadow); display: flex; align-items: flex-start; gap: 14px; }
      .tile { flex: 0 0 auto; width: 64px; height: 64px; border-radius: 20px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .15s; }
      .tile:hover { transform: scale(1.04); } .tile:active { transform: scale(.95); }
      .tile span { width: 40px; height: 40px; border-radius: 999px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
      .tile svg { width: 16px; height: 16px; margin-left: 2px; }
      .body { min-width: 0; flex: 1; }
      .title { font-weight: 600; font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .meta { color: var(--muted); font-size: 12px; margin: 4px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
      .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; }
      .resume { font-size: 12px; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
      .bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; flex: 1; min-width: 60px; }
      .bar i { display: block; height: 100%; background: var(--ink); border-radius: 999px; }
      .del { border: 0; background: transparent; color: var(--muted); border-radius: 999px; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: -6px -6px 0 0; }
      .del:hover { background: var(--surface-2); color: #b42318; }
      .del svg { width: 16px; height: 16px; }
      .empty { background: var(--surface); border-radius: 28px; padding: 28px; box-shadow: var(--shadow); max-width: 560px; }
      .empty .icon { width: 56px; height: 56px; border-radius: 999px; background: var(--mint); display: flex; align-items: center; justify-content: center; }
      .empty .icon svg { width: 24px; height: 24px; }
      .empty .mascot { display: block; width: 112px; height: 112px; }
      .empty h3 { margin: 16px 0 6px; font-size: 20px; letter-spacing: -0.01em; }
      .empty p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
      .empty a { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; height: 44px; padding: 0 20px; border-radius: 999px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 500; font-size: 14px; }
      .player { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); background: var(--surface); border-radius: 26px; padding: 14px 16px; box-shadow: var(--pop); display: none; max-width: 900px; margin: 0 auto; }
      .player.on { display: block; }
      .player .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .player .now { font-weight: 600; font-size: 14px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .player .close { border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 999px; cursor: pointer; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
      .player .close svg { width: 14px; height: 14px; }
      .section { font-size: 11px; color: #1c5c35; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin: 4px 0 0; min-height: 14px; }
      .sub-line { background: var(--paper); border-radius: 16px; padding: 10px 14px; min-height: 44px; font-size: 16px; line-height: 1.55; margin: 10px 0; text-align: center; }
      .w { opacity: .5; } .w.past { opacity: 1; } .w.on { background: var(--ink); color: #fff; border-radius: 4px; padding: 0 3px; opacity: 1; }
      audio { width: 100%; }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <a class="brand" href="/app" aria-label="Janngude — accueil">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="9" fill="rgba(255,255,255,.1)"/><path d="M10 10h12M10 15h8M10 20h12M10 25h5" stroke="#d8f6dc" stroke-width="2.4" stroke-linecap="round" fill="none"/><circle cx="23.5" cy="24" r="2.4" fill="#f0c2fb"/></svg>
          Janngude
        </a>
        <a class="back" href="/app" id="back">Retour à l’application</a>
      </header>
      <div class="panel">
        <span class="notch" aria-hidden="true"></span>
        <div class="wrap">
          <h1>Écoute hors ligne&nbsp;🎧</h1>
          <p class="sub">Les lectures que vous avez téléchargées, avec leurs sous-titres, disponibles sans connexion. Votre position de lecture est conservée.</p>
          <span class="status" id="status"></span>
          <div class="top">
            <h2>Mes lectures téléchargées <span class="count" id="count"></span></h2>
          </div>
          <div id="list"></div>
        </div>
      </div>
    </div>

    <div class="player" id="player" role="region" aria-label="Lecteur">
      <div class="head">
        <p class="now" id="now"></p>
        <button class="close" id="close" aria-label="Fermer le lecteur"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p class="section" id="section"></p>
      <div class="sub-line" id="subtitle">Appuyez sur lecture.</div>
      <audio id="audio" controls preload="metadata"></audio>
    </div>

    <script>
      const KEY = "janngude:offline";
      const MEDIA = "janngude-media-v1";
      const list = document.getElementById("list");
      const count = document.getElementById("count");
      const player = document.getElementById("player");
      const audio = document.getElementById("audio");
      const subtitle = document.getElementById("subtitle");
      const now = document.getElementById("now");
      const sectionEl = document.getElementById("section");
      const status = document.getElementById("status");
      const setStatus = () => (status.innerHTML = navigator.onLine ? "" : '<img src="/khadija/offline.png" alt="" width="56" height="56">Vous êtes hors connexion : seules les lectures téléchargées sont disponibles.');
      setStatus();
      window.addEventListener("online", setStatus);
      window.addEventListener("offline", setStatus);

      let tracks = [];
      try { tracks = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { tracks = []; }

      const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
      const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';
      const PASTELS = ["var(--sky)", "var(--lavender)", "var(--lemon)", "var(--pink)", "var(--mint)"];

      function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
      function escape(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
      function position(id) { const v = Number(localStorage.getItem("janngude:pos:" + id) || 0); return Number.isFinite(v) && v > 0 ? v : 0; }

      function render() {
        count.textContent = tracks.length ? String(tracks.length) : "";
        if (!tracks.length) {
          list.innerHTML = '<div class="empty"><img class="mascot" src="/khadija/headphones.png" alt="" width="112" height="112"><h3>Aucune lecture téléchargée</h3><p>Depuis l’onglet Écoute d’un cours, appuyez sur « Hors ligne » sur une lecture : le MP3 et ses sous-titres seront conservés sur cet appareil.</p><a href="/app">Aller à mes cours</a></div>';
          return;
        }
        list.innerHTML = "<ul>" + tracks.map((t, i) => {
          const pos = position(t.id);
          const pct = pos && t.durationSeconds ? Math.min(100, Math.round((pos / t.durationSeconds) * 100)) : 0;
          return `
          <li>
            <button class="tile" style="background:${PASTELS[i % PASTELS.length]}" data-i="${i}" aria-label="Écouter : ${escape(t.title)}"><span>${PLAY}</span></button>
            <div class="body">
              <p class="title">${escape(t.title)}</p>
              <p class="meta">${escape(t.subtitle || "")}</p>
              <div class="row">
                ${t.durationSeconds ? `<span class="chip">${fmt(t.durationSeconds)}</span>` : ""}
                <span class="chip">sous-titres${t.transcriptUrl ? "" : " indisponibles"}</span>
                ${pct ? `<span class="bar"><i style="width:${pct}%"></i></span><button class="resume" data-i="${i}">Reprendre à ${fmt(pos)}</button>` : ""}
              </div>
            </div>
            <button class="del" data-del="${i}" aria-label="Retirer de cet appareil" title="Retirer de cet appareil">${TRASH}</button>
          </li>`;
        }).join("") + "</ul>";
      }

      let words = [], sections = [], objectUrl = null, currentId = null;

      async function play(i) {
        const t = tracks[i];
        const cache = await caches.open(MEDIA);
        const res = await cache.match(t.src, { ignoreVary: true });
        if (!res) { alert("Fichier introuvable sur cet appareil. Téléchargez-le à nouveau depuis l’application."); return; }
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(await res.blob());
        audio.src = objectUrl;
        currentId = t.id;
        now.textContent = t.title;
        words = []; sections = []; subtitle.textContent = "Chargement…"; sectionEl.textContent = "";
        if (t.transcriptUrl) {
          const tr = await cache.match(t.transcriptUrl, { ignoreVary: true });
          if (tr) {
            const data = await tr.json();
            sections = data.sections || [];
            (data.paragraphs || []).forEach((p) => p.words.forEach((w) => words.push({ t: w[0], s: w[1], e: w[2] })));
          }
        }
        subtitle.textContent = words.length ? "" : "Sous-titres indisponibles pour cette lecture.";
        player.classList.add("on");
        const pos = position(t.id);
        audio.addEventListener("loadedmetadata", () => { if (pos > 3 && pos < audio.duration - 5) audio.currentTime = pos; }, { once: true });
        audio.play().catch(() => {});
      }

      function wordIndex(time) {
        let lo = 0, hi = words.length - 1, best = -1;
        while (lo <= hi) { const mid = (lo + hi) >> 1; if (words[mid].s <= time) { best = mid; lo = mid + 1; } else hi = mid - 1; }
        return best;
      }
      let lastSentence = -1;
      function tick() {
        if (!words.length || audio.paused) return;
        const t = audio.currentTime + 0.05;
        const i = wordIndex(t);
        if (i < 0) return;
        let start = i, end = i;
        while (start > 0 && !/[.!?…]["»)]?$/.test(words[start - 1].t)) start--;
        while (end < words.length - 1 && !/[.!?…]["»)]?$/.test(words[end].t)) end++;
        if (start !== lastSentence) {
          lastSentence = start;
          subtitle.innerHTML = words.slice(start, end + 1).map((w, k) => `<span class="w" data-k="${start + k}">${escape(w.t)}</span>`).join(" ");
        }
        subtitle.querySelectorAll(".w").forEach((el) => { const k = Number(el.dataset.k); el.className = "w" + (k === i ? " on" : k < i ? " past" : ""); });
        const sec = sections.reduce((acc, s, k) => (t >= s.start ? k : acc), -1);
        sectionEl.textContent = sec >= 0 ? sections[sec].title : "";
      }
      setInterval(tick, 120);
      let lastSave = 0;
      audio.addEventListener("timeupdate", () => {
        if (!currentId) return;
        const n = Date.now();
        if (n - lastSave > 2000) { lastSave = n; try { localStorage.setItem("janngude:pos:" + currentId, String(Math.floor(audio.currentTime))); } catch (e) {} render(); }
      });
      document.getElementById("close").addEventListener("click", () => { audio.pause(); player.classList.remove("on"); });

      list.addEventListener("click", async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.i !== undefined) play(Number(b.dataset.i));
        if (b.dataset.del !== undefined) {
          const t = tracks[Number(b.dataset.del)];
          if (!confirm("Retirer « " + t.title + " » de cet appareil ?")) return;
          const cache = await caches.open(MEDIA);
          await cache.delete(t.src); if (t.transcriptUrl) await cache.delete(t.transcriptUrl);
          tracks = tracks.filter((x) => x.id !== t.id);
          localStorage.setItem(KEY, JSON.stringify(tracks));
          render();
        }
      });
      render();
    </script>
  </body>
</html>
