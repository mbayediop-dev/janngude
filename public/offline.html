<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Écoute hors ligne · Janngude</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <style>
      :root { --page:#d9f0f5; --paper:#f4f4f4; --ink:#121212; --muted:#7c7c7c; --mint:#d8f6dc; --sky:#d6f0f6; --lavender:#e6d4fb; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Rubik, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--page); color: var(--ink); }
      .frame { margin: 8px; min-height: calc(100vh - 16px); background: var(--ink); border-radius: 32px; padding: 8px; display: flex; flex-direction: column; }
      header { color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; }
      header b { font-size: 22px; letter-spacing: -0.02em; }
      header a { color: #fff; opacity: .8; text-decoration: none; font-size: 14px; }
      .panel { flex: 1; background: var(--paper); border-radius: 28px; padding: 24px 16px 96px; }
      h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -0.02em; }
      .sub { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
      li { background: #fff; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
      li button { flex: 0 0 auto; }
      .title { font-weight: 600; font-size: 15px; margin: 0; }
      .meta { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
      .play { width: 44px; height: 44px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font-size: 18px; cursor: pointer; }
      .del { border: 0; background: #ededed; border-radius: 999px; padding: 8px 12px; font-size: 12px; cursor: pointer; }
      .empty { background: #fff; border-radius: 20px; padding: 28px; text-align: center; color: var(--muted); }
      .player { position: fixed; left: 16px; right: 16px; bottom: 16px; background: #fff; border-radius: 24px; padding: 14px 16px; box-shadow: 0 16px 40px -14px rgb(18 18 18 / .35); display: none; }
      .player.on { display: block; }
      .player .now { font-weight: 600; font-size: 14px; margin: 0 0 6px; }
      .sub-line { background: var(--paper); border-radius: 14px; padding: 10px 12px; min-height: 42px; font-size: 16px; line-height: 1.5; margin: 8px 0; }
      .w { opacity: .55; } .w.past { opacity: 1; } .w.on { background: var(--ink); color: #fff; border-radius: 4px; padding: 0 2px; opacity: 1; }
      audio { width: 100%; }
      .section { font-size: 12px; color: #1c5c35; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
      .status { font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <b>Janngude</b>
        <a href="/app" id="back">Retour à l’application</a>
      </header>
      <div class="panel">
        <h1>Écoute hors ligne 🎧</h1>
        <p class="sub">Les lectures que vous avez téléchargées, disponibles sans connexion. <span class="status" id="status"></span></p>
        <div id="list"></div>
      </div>
    </div>

    <div class="player" id="player">
      <p class="now" id="now"></p>
      <p class="section" id="section"></p>
      <div class="sub-line" id="subtitle">Appuyez sur lecture.</div>
      <audio id="audio" controls preload="metadata"></audio>
    </div>

    <script>
      const KEY = "janngude:offline";
      const MEDIA = "janngude-media-v1";
      const list = document.getElementById("list");
      const player = document.getElementById("player");
      const audio = document.getElementById("audio");
      const subtitle = document.getElementById("subtitle");
      const now = document.getElementById("now");
      const sectionEl = document.getElementById("section");
      const status = document.getElementById("status");
      status.textContent = navigator.onLine ? "" : "Vous êtes hors connexion.";
      window.addEventListener("online", () => (status.textContent = ""));
      window.addEventListener("offline", () => (status.textContent = "Vous êtes hors connexion."));

      let tracks = [];
      try { tracks = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { tracks = []; }

      function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

      function render() {
        if (!tracks.length) { list.innerHTML = '<div class="empty">Aucune lecture téléchargée. Depuis l’onglet Écoute d’un cours, utilisez le bouton « Hors ligne ».</div>'; return; }
        list.innerHTML = "<ul>" + tracks.map((t, i) => `
          <li>
            <button class="play" data-i="${i}" aria-label="Écouter">▶</button>
            <div style="min-width:0;flex:1">
              <p class="title">${escape(t.title)}</p>
              <p class="meta">${escape(t.subtitle || "")}${t.durationSeconds ? " · " + fmt(t.durationSeconds) : ""}</p>
            </div>
            <button class="del" data-del="${i}">Retirer</button>
          </li>`).join("") + "</ul>";
      }
      function escape(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

      let words = [], sections = [], objectUrl = null, currentId = null;

      async function play(i) {
        const t = tracks[i];
        const cache = await caches.open(MEDIA);
        const res = await cache.match(t.src, { ignoreVary: true });
        if (!res) { alert("Fichier introuvable dans le cache. Téléchargez-le à nouveau depuis l’application."); return; }
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(await res.blob());
        audio.src = objectUrl;
        currentId = t.id;
        now.textContent = t.title;
        words = []; sections = []; subtitle.textContent = "Chargement…"; sectionEl.textContent = "";
        if (t.transcriptUrl) {
          const tr = await cache.match(t.transcriptUrl, { ignoreVary: true });
          if (tr) {
            const data = await tr.json();
            sections = data.sections || [];
            (data.paragraphs || []).forEach((p) => p.words.forEach((w) => words.push({ t: w[0], s: w[1], e: w[2] })));
          }
        }
        subtitle.textContent = words.length ? "" : "Sous-titres indisponibles pour cette lecture.";
        player.classList.add("on");
        const pos = Number(localStorage.getItem("janngude:pos:" + t.id) || 0);
        audio.addEventListener("loadedmetadata", () => { if (pos > 3 && pos < audio.duration - 5) audio.currentTime = pos; }, { once: true });
        audio.play().catch(() => {});
      }

      function wordIndex(time) {
        let lo = 0, hi = words.length - 1, best = -1;
        while (lo <= hi) { const mid = (lo + hi) >> 1; if (words[mid].s <= time) { best = mid; lo = mid + 1; } else hi = mid - 1; }
        return best;
      }
      let lastSentence = -1;
      function tick() {
        if (!words.length || audio.paused) return;
        const t = audio.currentTime + 0.05;
        const i = wordIndex(t);
        if (i < 0) return;
        let start = i, end = i;
        while (start > 0 && !/[.!?…]["»)]?$/.test(words[start - 1].t)) start--;
        while (end < words.length - 1 && !/[.!?…]["»)]?$/.test(words[end].t)) end++;
        if (start !== lastSentence) {
          lastSentence = start;
          subtitle.innerHTML = words.slice(start, end + 1).map((w, k) => `<span class="w" data-k="${start + k}">${escape(w.t)}</span>`).join(" ");
        }
        subtitle.querySelectorAll(".w").forEach((el) => { const k = Number(el.dataset.k); el.className = "w" + (k === i ? " on" : k < i ? " past" : ""); });
        const sec = sections.reduce((acc, s, k) => (t >= s.start ? k : acc), -1);
        sectionEl.textContent = sec >= 0 ? sections[sec].title : "";
      }
      setInterval(tick, 120);
      let lastSave = 0;
      audio.addEventListener("timeupdate", () => {
        if (!currentId) return;
        const n = Date.now();
        if (n - lastSave > 2000) { lastSave = n; try { localStorage.setItem("janngude:pos:" + currentId, String(Math.floor(audio.currentTime))); } catch (e) {} }
      });

      list.addEventListener("click", async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.i !== undefined) play(Number(b.dataset.i));
        if (b.dataset.del !== undefined) {
          const t = tracks[Number(b.dataset.del)];
          const cache = await caches.open(MEDIA);
          await cache.delete(t.src); if (t.transcriptUrl) await cache.delete(t.transcriptUrl);
          tracks = tracks.filter((x) => x.id !== t.id);
          localStorage.setItem(KEY, JSON.stringify(tracks));
          render();
        }
      });
      render();
    </script>
  </body>
</html>
